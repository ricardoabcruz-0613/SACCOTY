<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clube SAC Coty • Reconhecer transforma</title><style>
:root{--blue:#143d80;--navy:#112b52;--yellow:#ffcc4b;--muted:#68788e;--line:#e3e9f1}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--navy);font:15px 'Segoe UI',Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #db9d09;outline-offset:3px}.demo{background:#fff3cb;text-align:center;padding:9px;font-size:12px;color:#68521a}header{background:white;border-bottom:1px solid var(--line);padding:22px 5%;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:21px;font-weight:800;letter-spacing:-.6px}.brand span{color:#dba01a;font-size:29px;margin-right:9px}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:2px;margin-left:40px}nav{display:flex;gap:8px}button{border:0;border-radius:10px;padding:11px 17px;background:var(--blue);color:white;font-weight:600}nav button{background:white;color:var(--muted)}nav button.active{background:#eaf0fb;color:var(--blue)}.profile{display:flex;align-items:center;gap:9px;font-size:13px}.avatar{border-radius:50%;background:#e7edfa;padding:12px;font-weight:700}main{max-width:1240px;margin:auto;padding:30px 30px 60px}.hero{position:relative;overflow:hidden;background:var(--blue);border-radius:22px;min-height:245px;padding:35px 40px;color:white;display:flex;justify-content:space-between;align-items:center;gap:30px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:700;color:#c5d6fc}h1{font-size:36px;line-height:1.15;margin:13px 0;letter-spacing:-1px}.hero p{color:#d5e2fb;max-width:480px;line-height:1.6}.hero .star{position:absolute;right:32%;top:20px;font-size:170px;color:#ffffff0b;transform:rotate(12deg)}.balance{z-index:1;min-width:230px;background:#ffffff12;border:1px solid #ffffff30;border-radius:17px;padding:23px}.balance strong{display:block;font-size:38px;color:var(--yellow);margin:10px 0}.balance small{color:#d5e2fb}.steps{display:flex;gap:30px;padding:22px 3px;color:var(--muted);font-size:13px}.steps b{color:var(--blue);margin-right:7px}.sectionhead{display:flex;align-items:end;justify-content:space-between;margin:20px 0;gap:20px}h2{font-size:25px;letter-spacing:-.5px;margin:0 0 6px}.sub{color:var(--muted);margin:0;line-height:1.6}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:23px}input,select{padding:12px;border:1px solid #ccd6e4;border-radius:9px;background:white;color:var(--navy);min-width:0}.filters input{margin-left:auto;min-width:260px}.chip{background:white;color:var(--muted);border:1px solid var(--line)}.chip.active{background:var(--navy);color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.art{height:175px;display:grid;place-items:center;font-size:77px;position:relative;background:#edf2fa}.art img{width:100%;height:100%;object-fit:contain}.tag{position:absolute;left:15px;top:14px;background:white;border-radius:6px;padding:5px 8px;font-size:10px;font-weight:700;color:var(--blue)}.cardbody{padding:20px}.category{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}h3{font-size:19px;margin:9px 0}.desc{color:var(--muted);font-size:13px;line-height:1.5;min-height:39px}.price{display:flex;justify-content:space-between;align-items:center;margin:19px 0 14px}.price strong{font-size:21px}.price strong span{color:#dca515}.price small{font-size:11px;color:var(--muted)}.card button{width:100%}button:disabled{opacity:.45;cursor:not-allowed}.panel{background:white;border:1px solid var(--line);padding:24px;border-radius:16px;margin:20px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row button{flex:0 0 auto}.light{background:#eaf0fa;color:var(--blue)}.danger{background:#fff0ed;color:#a22d20}.notice{background:#edf4ff;border-left:3px solid var(--blue);padding:15px;line-height:1.6;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:14px 10px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:11px}label{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--muted);margin:12px 0}.badge{padding:5px 9px;background:#fff3ce;color:#795b0c;border-radius:20px;font-size:11px}.empty{text-align:center;padding:45px;color:var(--muted)}footer{text-align:center;font-size:12px;color:var(--muted);padding:25px;border-top:1px solid var(--line)}dialog{border:0;border-radius:18px;max-width:470px;width:calc(100% - 32px);padding:28px;color:var(--navy);box-shadow:0 20px 90px #10264440}dialog::backdrop{background:#10264470}dialog input,dialog select{width:100%}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:15px 24px;border-radius:12px;z-index:5;box-shadow:0 8px 30px #0002}.hidden{display:none!important}@media(max-width:850px){header{flex-wrap:wrap}.profile{margin-left:auto}nav{order:3;width:100%;overflow:auto}main{padding:20px 16px}.grid{grid-template-columns:repeat(2,1fr)}.hero{padding:26px;flex-wrap:wrap}h1{font-size:29px}.balance{width:100%}.steps{gap:10px;flex-wrap:wrap}.filters input{margin:0;width:100%}.sectionhead{align-items:start;flex-direction:column}.panel{overflow:auto}}@media(max-width:520px){.grid{grid-template-columns:1fr}.brand{font-size:18px}.profile .avatar{display:none}nav button{padding:10px}.steps{font-size:11px}.hero .star{display:none}}
header{flex-wrap:wrap}nav{order:3;width:100%;overflow-x:auto}nav button{flex-shrink:0}.profile{flex-wrap:wrap;max-width:100%}.empty{grid-column:1/-1}@media(max-width:600px){.profile{width:100%;margin:0}.hero{padding:24px}.row{align-items:stretch}.row>label{flex-basis:100%}}
</style></head><body><header><div class="brand"><span>✦</span>Clube SAC Coty<small>SEU TALENTO VAI ALÉM</small></div><nav id="nav"></nav><div class="profile"><span class="avatar" id="initials"></span><span id="username"></span><button class="light" onclick="logout()">Sair</button></div></header><main id="app"></main><footer>Clube SAC Coty · Cada conquista merece reconhecimento.<br><small>Programa de reconhecimento do time.</small></footer><dialog id="modal"></dialog><div id="toast" class="toast hidden" role="status"></div><script>
let db={users:[],products:[],orders:[],ledger:[]};let uid=0,page='catalog',category='Todos',query='',cart=[];const app=document.getElementById('app'),modal=document.getElementById('modal');const user=()=>db.users.find(u=>u.id===uid);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const showDate=v=>new Date(v).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'});const num=n=>Number(n).toLocaleString('pt-BR');const privileged=()=>['Administrador','Gestor'].includes(user().role);function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.add('hidden'),4000)}function go(p){page=p;render()}function render(){document.getElementById('username').innerHTML=esc(user().name)+'<br><small>'+esc(user().role)+'</small>';document.getElementById('initials').textContent=user().name.split(' ').map(x=>x[0]).join('');let tabs=[['catalog','Loja de recompensas'],['orders','Meus pedidos'],['history','Minhas estrelas'],['cart','Sacola ('+cart.reduce((a,b)=>a+b.qty,0)+')']];if(privileged())tabs.push(['manage','Gestão']);document.getElementById('nav').innerHTML=tabs.map(([p,n])=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${n}</button>`).join('');({catalog,orders,history,cart:cartView,manage}[page]||catalog)()}
function catalog(){app.innerHTML=`<section class="hero"><div><div class="eyebrow">Seu resultado merece ser celebrado</div><h1>Grandes conquistas.<br>Recompensas à sua altura.</h1><p>Você faz a diferença todos os dias. Transforme suas estrelas em algo especial para você.</p></div><span class="star">✦</span><div class="balance">Seu saldo disponível<strong>✦ ${num(user().balance)}</strong><small>estrelas para escolher sua próxima recompensa</small></div></section><div class="steps"><span><b>01</b> Conquiste suas metas</span><span><b>02</b> Acumule estrelas</span><span><b>03</b> Escolha sua recompensa</span></div><div class="sectionhead"><div><h2>Qual será sua próxima conquista?</h2><p class="sub">Explore as recompensas e encontre a sua favorita.</p></div><span class="sub">${db.products.length} recompensas no catálogo</span></div><div class="filters">${['Todos','Dia a dia','Tecnologia','Experiências','Bem-estar'].map(c=>`<button class="chip ${category===c?'active':''}" onclick="category='${c}';catalog()">${c}</button>`).join('')}<input aria-label="Buscar recompensa" placeholder="⌕  Buscar recompensa" value="${esc(query)}" oninput="query=this.value;cards()"></div><div class="grid" id="cards"></div>`;cards()}
function cards(){let ps=db.products.filter(p=>(category==='Todos'||p.category===category)&&p.name.toLocaleLowerCase().includes(query.toLocaleLowerCase()));document.getElementById('cards').innerHTML=ps.length?ps.map(p=>`<article class="card"><div class="art" style="background:${p.color||'#edf2fa'}"><span class="tag">${p.stock?'ESCOLHA SUA RECOMPENSA':'ESGOTADO'}</span>${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:p.emoji||'🎁'}</div><div class="cardbody"><span class="category">${esc(p.category)}</span><h3>${esc(p.name)}</h3><p class="desc">${esc(p.description)}</p><div class="price"><strong><span>✦</span> ${num(p.price)}</strong><small>${p.stock} disponíveis</small></div><button onclick="add(${p.id})" ${p.stock?'':'disabled'}>Adicionar à sacola</button></div></article>`).join(''):'<div class="empty">Nenhuma recompensa encontrada.</div>'}
function add(id){let p=db.products.find(x=>x.id===id),item=cart.find(x=>x.id===id);if((item?.qty||0)>=p.stock)return toast('Quantidade máxima disponível atingida.');if(item)item.qty++;else cart.push({id,qty:1});render();toast('Recompensa adicionada à sacola.')}
function cartView(){let total=cart.reduce((s,i)=>s+db.products.find(p=>p.id===i.id).price*i.qty,0);app.innerHTML=`<h2>Sua sacola</h2><p class="sub">Escolhas que celebram suas conquistas.</p><div class="panel">${cart.length?cart.map(i=>{let p=db.products.find(p=>p.id===i.id);return `<div class="row" style="padding:15px 0;border-bottom:1px solid var(--line)"><span>${p.emoji||'🎁'} ${esc(p.name)} × ${i.qty}</span><strong>✦ ${num(p.price*i.qty)}</strong><button class="light" onclick="cart=cart.filter(i=>i.id!==${i.id});render()">Remover</button></div>`}).join('')+`<p>Total: <b>✦ ${num(total)}</b> · Saldo: <b>✦ ${num(user().balance)}</b></p><p class="sub">Retirada com a equipe responsável, após a confirmação da disponibilidade.</p><br><button onclick="checkout()" ${total>user().balance?'disabled':''}>Confirmar resgate</button>${total>user().balance?'<p>Você ainda precisa de '+num(total-user().balance)+' estrelas.</p>':''}`:'<div class="empty">Sua sacola está vazia. Escolha uma recompensa para começar.<br><br><button onclick="go(\'catalog\')">Explorar a loja</button></div>'}</div>`}
function orderTable(os,admin=false){return os.length?`<table><thead><tr><th>PEDIDO / DATA</th>${admin?'<th>COLABORADOR</th>':''}<th>RECOMPENSA</th><th>ESTRELAS</th><th>STATUS</th>${admin?'<th>AÇÃO</th>':''}</tr></thead><tbody>${os.map(o=>`<tr><td>#${String(o.id).slice(-6)}<br><small>${esc(showDate(o.date))}</small></td>${admin?'<td>'+esc(db.users.find(u=>u.id===o.uid)?.name||'')+'</td>':''}<td>${o.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')}</td><td>✦ ${num(o.total)}</td><td><span class="badge">${o.status}</span></td>${admin?`<td>${!['Entregue','Cancelado'].includes(o.status)?`<button class="light" onclick="statusOrder(${o.id},'${o.status==='Solicitado'?'Pronto para retirada':'Entregue'}')">${o.status==='Solicitado'?'Liberar retirada':'Registrar entrega'}</button> <button class="danger" onclick="cancelAsk(${o.id})">Cancelar</button>`:'—'}</td>`:''}</tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum pedido por aqui ainda.</div>'}
function orders(){app.innerHTML='<h2>Meus pedidos</h2><p class="sub">Acompanhe suas recompensas até a entrega.</p><div class="panel">'+orderTable(db.orders.filter(o=>o.uid===uid))+'</div>'}
function history(){app.innerHTML=`<h2>Minhas estrelas</h2><div class="panel"><p>Saldo disponível</p><h1>✦ ${num(user().balance)}</h1><p class="sub">Estrelas creditadas pelo atingimento de metas.</p></div><div class="panel">${ledgerTable(db.ledger.filter(l=>l.uid===uid))}</div>`}
function ledgerTable(ls){return ls.length?`<table><tr><th>DATA</th><th>MOTIVO</th><th>ESTRELAS</th><th>RESPONSÁVEL</th></tr>${ls.map(l=>`<tr><td>${esc(showDate(l.date))}</td><td>${esc(l.reason)}</td><td>${l.amount>0?'+':''}${num(l.amount)}</td><td>${esc(l.by)}</td></tr>`).join('')}</table>`:'<div class="empty">As próximas movimentações aparecerão aqui.</div>'}
function cancelAsk(id){modal.innerHTML='<h2>Cancelar pedido?</h2><p>As estrelas serão devolvidas ao colaborador e o estoque será reposto.</p><div class="row"><button class="light" onclick="modal.close()">Voltar</button><button class="danger" onclick="cancelOrder('+id+')">Confirmar cancelamento</button></div>';modal.showModal()}
</script><script src="/app.js"></script></body></html>
